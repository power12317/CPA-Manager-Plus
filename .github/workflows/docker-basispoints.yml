name: Publish Basispoints branch image

on:
  push:
    tags:
      - 'basispoints/v*'

permissions:
  contents: read

concurrency:
  group: docker-basispoints-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'power12317/CPA-Manager-Plus'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate branch tag and generate build metadata
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^basispoints/v[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9]+$ ]]; then
            echo "Invalid Basispoints branch tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "VERSION=${GITHUB_REF_NAME#basispoints/}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish Manager and panel
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.manager-server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/power12317/cpa-manager-plus-basispoints:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.title=CPA Manager Plus Basispoints
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            VERSION=${{ env.VERSION }}
            SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=basispoints
          cache-to: type=gha,scope=basispoints,mode=max
