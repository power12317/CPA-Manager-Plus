services:
  cpa-manager-plus:
    extends:
      file: docker-compose.image.yml
      service: cpa-manager-plus
    build:
      context: .
      dockerfile: Dockerfile.manager-server
      args:
        VERSION: "${CPAMP_VERSION:-dev}"
    image: ${CPAMP_IMAGE:-ghcr.io/power12317/cpamp-codex-runtime:dev}
    # Never resolve the source deployment to an upstream or stale registry image.
    pull_policy: build

volumes:
  cpa-manager-plus-data:
